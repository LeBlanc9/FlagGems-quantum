[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-gems-quantum"
version = "0.1.0.dev0"
description = "Triton kernels for dense-statevector quantum simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
